name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Build documentation site
        env:
          DOC_VIEWS_ENDPOINT: ${{ vars.DOC_VIEWS_ENDPOINT || 'https://xiaomeng-document-views.document-views.workers.dev' }}
        run: |
          node --input-type=module <<'JS'
          import { documentViewsEndpoint } from './shared/document-views.mjs';
          const endpoint = documentViewsEndpoint(process.env.DOC_VIEWS_ENDPOINT);
          if (!endpoint) throw Error('Invalid document analytics endpoint');
          const url = new URL('/v1/stats', endpoint);
          url.searchParams.set('site', 'https://a134448643-hub.github.io/openxr-ui-docs/');
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw Error('Analytics health check HTTP ' + response.status);
          const stats = await response.json();
          if (![stats.totalViews, stats.recentViews, stats.recentVisitors].every(Number.isSafeInteger) || !Array.isArray(stats.regions)) {
            throw Error('Invalid analytics response');
          }
          console.log('Public document analytics endpoint is ready.');
          JS
          npm run build:site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
