      richText:
        zh:
          - type: text
            text: 组件设置：
          - type: hardBreak
          - type: text
            text: 1.是否为手势交互？：选择你的交互模式
          - type: hardBreak
          - type: text
            text: 2.E_控制器手：判断作用的是左手还是右手
          - type: hardBreak
          - type: text
            text: 3.检测通道：默认与UI通道的UI交互，组件命中UI时切换检测通道（当前命中的UI通道），始终至于第一次命中的UI交互，防止UI重叠的情况下，交互出现异常。
          - type: hardBreak
          - type: text
            text: 4.指针索引：控件组件的编号，用于控件区分命中的是哪种手的控件交互组件
      documentOrder:
        zh: 8
        en: 9
