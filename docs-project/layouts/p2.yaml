      richText:
        zh:
          - type: text
            text: 组件作用：
          - type: hardBreak
          - type: text
            text: 1.UE5.6之后可以脱离MetaXR/PICOXR插件的手势组件运行手势功能。
          - type: hardBreak
          - type: text
            text: 2.用于手势追踪，基于Openxr提供的手势骨骼变换，驱动PoseableMesh。
          - type: hardBreak
          - type: text
            text: 注意：所以，该组件需要放置在PoseableMesh下面！这非常重要！
      documentOrder:
        zh: 13
        en: 14
    attachments: []
  b1769104614867:
    type: text
    isFloating: false
    style:
      size: text-base
      isSectionHeader: false
      paragraphTypes:
        zh:
          type: paragraph
        en:
          type: paragraph
          level: 2
      richText:
        zh:
          - type: text
            text: 该组件通过数据资产设置对应的参数
          - type: hardBreak
          - type: text
            text: 数据资产设置：
          - type: hardBreak
          - type: text
            text: 1.是否开启调试？：
          - type: hardBreak
          - type: text
            text: 基于Openxr提供的26个手势骨骼的变换，生成26个小方块跟随对应手势骨骼，便于参考手势真实的位置。
          - type: hardBreak
          - type: text
            text: 2.E 控制器手：
          - type: hardBreak
          - type: text
            text: 用于判断当前组件驱动的是左手还是右手
          - type: hardBreak
          - type: text
            text: 3.XR手势/自定义骨骼映射：用于匹配Openxr手势骨骼和自定义手势骨骼的名称
          - type: hardBreak
          - type: text
            text: 4.设置手势相对偏移：
          - type: hardBreak
          - type: text
            text: 用于纠正手势骨骼位置注意！该参数仅在pico设备上生效，详细原因看前置条件-PICO须知
          - type: hardBreak
          - type: text
            text: 5.设置手势相对旋转：
          - type: hardBreak
          - type: text
            text: 用于矫正手势模型的整体旋转
          - type: hardBreak
          - type: text
            text: 6.手势骨骼旋转校准：
          - type: hardBreak
          - type: text
            text: 用于矫正手势骨骼的旋转轴向，手势模型所有骨骼需要轴向统一！
          - type: hardBreak
          - type: text
            text: 7.XR手势参照网格体：
          - type: hardBreak
          - type: text
            text: 用于观察Openxr手势的参考小方块模型
          - type: hardBreak
          - type: text
            text: 8.骨骼网格体样式：用于快速定位作用的手势模型文件夹位置
      documentOrder:
        zh: 15
        en: 16
    attachments: []
