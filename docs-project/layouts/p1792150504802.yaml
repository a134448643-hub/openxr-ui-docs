      richText:
        zh:
          - type: text
            text: 指定包含要显示的 UI 的 Actor 类。
          - type: hardBreak
          - type: text
            text: 在构造脚本中调用 BPC_UI显示组件 的「编辑器调试」节点，可在编辑器中预览放置位置。手势模式下的位置以运行时预览为准。
          - type: hardBreak
          - type: text
            text: 设置检测箭头的位置，通常放在掌心附近。视线朝向箭头并满足检测条件时，UI 才会显示。
        en:
          - type: text
            text: Assign the Actor class that contains the UI you want to display.
          - type: hardBreak
          - type: text
            text: Call OnEditorDebug on AC_UIDisplay in the Construction Script to preview
              its placement. For hand tracking, check the final placement at
              runtime.
          - type: hardBreak
          - type: text
            text: Position the detection arrow, usually near the palm. The UI appears when
              the viewer looks toward the arrow and the detection conditions are
              met.
      documentOrder:
        zh: 28
        en: 29
    attachments: []
