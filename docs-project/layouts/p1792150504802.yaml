              OnEditorDebug node to preview the configured position in the
              editor. Positioning is harder in hand-tracking mode, so preview
              the result at runtime.
          - type: hardBreak
          - type: text
            text: "Set ArrowLocation. The arrow acts as the trigger reference: looking
              toward it triggers the UI. It is usually placed at the palm."
