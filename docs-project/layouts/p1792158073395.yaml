        zh:
          - type: text
            text: "1. 打开 "
          - type: text
            marks:
              - type: bold
            text: BPC_OpenXR手势
          - type: text
            text: ，定位编译错误所在的手部追踪节点。
          - type: hardBreak
          - type: text
            text: "2. 原文给出的修复方案是改用 "
          - type: text
            marks:
              - type: bold
            text: GetHandTrackingState
          - type: text
            text: ，并重新连接报错引脚。
          - type: hardBreak
          - type: text
            text: 3. 完成后编译蓝图，运行项目，检查左右手数据、骨骼姿态和 UI 交互。
        en:
          - type: text
            text: 1. Open AC_OpenXRGesture and locate the hand-tracking nodes causing
              compilation errors.
          - type: hardBreak
          - type: text
            text: 2. The original documentation recommends switching to GetHandTrackingState
              and reconnecting the affected pins.
          - type: hardBreak
          - type: text
            text: 3. Compile the Blueprint, run the project, and check left- and right-hand
              data, bone poses, and UI interaction.
      documentOrder:
        zh: 3
