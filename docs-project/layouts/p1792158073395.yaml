      richText:
        zh:
          - type: text
            text: "1. 打开 "
          - type: text
            text: BPC_OpenXR手势
            marks:
              - type: bold
          - type: text
            text: ，定位编译报错的手部追踪节点。
          - type: hardBreak
          - type: text
            text: "2. 将旧的 "
          - type: text
            text: Get
            marks:
              - type: bold
          - type: text
            text: " Motion Controller Data 节点替换为 Get "
          - type: text
            text: Hand
            marks:
              - type: bold
          - type: text
            text: " "
          - type: text
            text: Tracking
            marks:
              - type: bold
          - type: text
            text: " "
          - type: text
            text: State
            marks:
              - type: bold
          - type: text
            text: ，再重新连接受影响的引脚。
          - type: hardBreak
          - type: text
            text: 3. 编译蓝图并运行项目，检查左右手数据、骨骼姿态和 UI 交互。
        en:
          - type: text
            text: 1. Open AC_OpenXRGesture and locate the hand-tracking node reported by the
              compiler.
          - type: hardBreak
          - type: text
            text: 2. Replace Get Motion Controller Data with Get Hand Tracking State and
              reconnect the affected pins.
          - type: hardBreak
          - type: text
            text: 3. Compile the Blueprint and run the project to check tracking data for
              both hands, bone poses, and UI interaction.
      documentOrder:
        zh: 5
        en: 6
