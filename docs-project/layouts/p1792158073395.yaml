      richText:
        zh:
          - type: text
            text: 建议使用UE5.66及以上版本开发，由于虚幻引擎VR模板版本更迭的原因，VR模板变更，节点被弃用。
          - type: hardBreak
          - type: text
            text: 如果你使用低版本的项目5.3导入高版本例如5.5/5.7，BPC_OpenXR手势会报错，5.3的节点被启用
        en:
          - type: text
            text: The source recommends UE 5.66 or later for development. Changes between
              Unreal Engine VR Template versions have replaced template content
              and deprecated nodes.
          - type: hardBreak
          - type: text
            text: When a project made in an older version such as 5.3 is migrated to a newer
              version such as 5.5 or 5.7, AC_OpenXRGesture may report errors
              involving nodes from 5.3.
      documentOrder:
        zh: 0
        en: 1
