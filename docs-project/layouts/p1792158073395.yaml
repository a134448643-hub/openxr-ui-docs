      richText:
        zh:
          - type: text
            text: 建议使用 UE 5.6 或更高版本进行开发。随 UE 版本变更，VR 模板和部分蓝图节点也会更新。
          - type: hardBreak
          - type: text
            text: 将 UE 5.3 工程迁移至 UE 5.5 或 5.7 时，旧版手部追踪节点可能导致 BPC_OpenXR手势 编译报错。
        en:
          - type: text
            text: UE 5.6 or later is recommended for development. The VR Template and some
              Blueprint nodes change between Unreal Engine versions.
          - type: hardBreak
          - type: text
            text: When migrating a UE 5.3 project to UE 5.5 or 5.7, older hand-tracking
              nodes may cause compilation errors in AC_OpenXRGesture.
      documentOrder:
        zh: 2
        en: 3
    attachments: []
