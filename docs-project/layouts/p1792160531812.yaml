      richText:
        zh:
          - type: text
            text: |-
              手势旋转
              中指，无名指，小拇指握拳并且手掌向右垂直，进入旋转模式手变成高亮状态
              保持高亮状态，捏合食指和大拇指，触发向右旋转（左手同理）
              食指捏合同样作用物体抓取
        en:
          - type: text
            text: Hand-gesture turning
          - type: hardBreak
          - type: text
            text: Curl the middle, ring, and little fingers into a fist and hold the palm
              vertically facing right. The hand becomes highlighted when turning
              mode is active.
          - type: hardBreak
          - type: text
            text: Keep the hand highlighted and pinch the index finger and thumb to turn
              right. Apply the same gesture with the left hand to turn left.
          - type: hardBreak
          - type: text
            text: The index-finger pinch is also used to grab objects.
      documentOrder:
        zh: 4
        en: 5
    attachments: []
