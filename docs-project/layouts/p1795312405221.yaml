          type: paragraph
      isSectionHeader: false
      paragraphPresence:
        zh: true
        en: true
      richText:
        zh:
          - type: text
            text: 1. 使用 UE 5.7 打包的 PICO Android 应用可能在一体机上启动时闪退。此前在官方示例中也观察到类似现象。
          - type: hardBreak
          - type: text
            text: "2. 为 PICO 打包 Android 应用时，需要启用 "
          - type: text
            text: PICO OpenXR
            marks:
              - type: bold
          - type: text
            text: " "
          - type: text
            text: 或
            marks:
              - type: bold
          - type: text
            text: " "
          - type: text
            text: PICO XR
            marks:
              - type: bold
          - type: text
            text: " 插件。"
        en:
          - type: text
            text: 1. PICO Android builds made with UE 5.7 may crash at launch on the
              headset. Similar behavior was previously observed in the official
              sample.
          - type: hardBreak
          - type: text
            text: 2. Enable the PICO OpenXR or PICO XR plugin when packaging an Android
              application for PICO.
      documentOrder:
        zh: 1
        en: 1
    attachments: []
  review-36-part-4:
    type: text
    isFloating: false
    style:
