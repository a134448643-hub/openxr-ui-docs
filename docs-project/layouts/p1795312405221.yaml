      isSectionHeader: false
      paragraphPresence:
        zh: true
        en: true
      richText:
        zh:
          - type: text
            text: 3. 在 UE 5.5 中，PICO 插件可能导致 UI 控件交互异常。当时尚无解决方法。
        en:
          - type: text
            text: 3. In UE 5.5, the PICO plugin may interfere with widget interaction. No
              workaround was available when this issue was observed.
      documentOrder:
        zh: 2
        en: 2
    attachments: []
  review-36-part-6:
