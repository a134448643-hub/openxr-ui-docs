          - type: text
            text: "- 优化蓝图逻辑，简化组件配置流程并修复问题。"
          - type: hardBreak
          - type: text
            text: "- 重置手势模型更新流程。在 BPC_OpenXR手势 中调用「更换手势模型事件」并传入要使用的手势数据资产，即可更新手势模型。"
          - type: hardBreak
          - type: text
            text: "- 重置滚动框交互逻辑，恢复通过模拟鼠标右键拖拽来滚动。"
          - type: hardBreak
          - type: text
            text: "- 新增抓取并移动 UI 面板的交互。"
        en:
          - type: text
            text: "- Optimized Blueprint logic, simplified component setup, and fixed bugs."
          - type: hardBreak
          - type: text
            text: "- Reworked hand model updates. On AC_OpenXRGesture, call
              OnGestureModelChangedEvent with the gesture data asset you want to
              use."
          - type: hardBreak
          - type: text
            text: "- Reworked Scroll Box interaction to restore scrolling by simulating a
              right mouse button drag."
          - type: hardBreak
          - type: text
            text: "- Added the ability to grab and move UI panels."
