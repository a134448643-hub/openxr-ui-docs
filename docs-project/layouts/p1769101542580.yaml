            text: 1. 准备与 OpenXR 手部骨骼结构相适配的模型，检查骨骼名称、层级及旋转轴向。
          - type: hardBreak
          - type: text
            text: 2. 如需双手 UI 交互，准备左右手模型，并分别设置对应的手势数据资产。
          - type: hardBreak
          - type: text
            text: "3. 在 "
          - type: text
            marks:
              - type: bold
            text: PAD_手势配置
          - type: text
            text: " 中填写骨骼映射，设置位置偏移、整体旋转及骨骼旋转校准。"
        en:
          - type: text
            text: 1. Prepare a model compatible with the OpenXR hand skeleton. Check bone
              names, hierarchy, and rotation axes.
          - type: hardBreak
          - type: text
            text: 2. For UI interaction with both hands, prepare left- and right-hand models
              and assign the corresponding gesture data assets separately.
          - type: hardBreak
          - type: text
            text: 3. In PAD_GestureConfig, configure XRGestureToCustomBoneMap,
              GestureRelativeOffset, GestureRelativeRotation, and
              GestureBoneRotationCalibration.
      documentOrder:
        zh: 26
        en: 27
