            text: PICO OpenXR或者PICO XR
          - type: text
            text: " 插件。"
        en:
          - type: text
            text: "1. Recorded behavior: PICO Android builds in UE 5.7 may crash at startup
              on the standalone headset. The original documentation reports the
              same behavior in the official sample."
          - type: hardBreak
          - type: text
            text: 2. PICO Android packaging requires the PICO OpenXR or PICO XR plugin.
      documentOrder:
