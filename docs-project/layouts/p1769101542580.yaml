      richText:
        zh:
          - type: text
            text: 1. 确认 VR 开发环境可用：已开启设备开发者权限，可以正常串流或运行 VR 项目，并能够识别手部追踪。
          - type: hardBreak
          - type: text
            text: "2. "
          - type: text
            marks:
              - type: bold
            text: 项目必须启用 OpenXR 和 OpenXRHandTracking。
          - type: text
            text: 缺少依赖插件时，相关蓝图可能报错。
          - type: hardBreak
          - type: text
            text: 3. 手势追踪效果受设备、环境及硬件能力影响。排查识别问题时，应先确认设备本身能稳定输出手部追踪数据。
        en:
          - type: text
            text: "1. Verify that your VR development environment works: enable developer
              permissions on the device, confirm that VR streaming or standalone
              VR applications run correctly, and check that hand tracking is
              recognized."
          - type: hardBreak
          - type: text
            text: 2. Enable OpenXR and OpenXRHandTracking in the project. Missing
              dependencies may cause errors in the related Blueprints.
          - type: hardBreak
          - type: text
            text: 3. Hand tracking depends on the device, environment, and hardware
              capabilities. When troubleshooting recognition issues, first
              confirm that the device provides stable hand-tracking data.
      documentOrder:
        zh: 16
        en: 17
    attachments: []
