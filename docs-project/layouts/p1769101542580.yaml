          - type: hardBreak
          - type: hardBreak
          - type: text
            marks:
              - type: textStyle
                attrs:
                  fontSize: null
                  color: "#d97706"
              - type: bold
            text: 解决方法：
          - type: hardBreak
          - type: hardBreak
          - type: text
            marks:
              - type: textStyle
                attrs:
                  fontSize: null
                  color: "#d97706"
              - type: bold
            text: 1.Quest需要开启metaxr，项目设置找到metaxr
          - type: hardBreak
          - type: hardBreak
          - type: text
            marks:
              - type: textStyle
                attrs:
                  fontSize: null
                  color: "#d97706"
              - type: bold
            text: 2.XR API选用Epic Native OpenXR with Oculus vendor extensions
          - type: hardBreak
          - type: hardBreak
          - type: text
            marks:
              - type: textStyle
                attrs:
                  fontSize: null
                  color: "#d97706"
              - type: bold
            text: 3.Hand Tracking Support选择Controllers and Hands
          - type: hardBreak
          - type: hardBreak
          - type: text
            marks:
              - type: textStyle
                attrs:
                  fontSize: null
                  color: "#d97706"
              - type: bold
            text: MetaXR下载链接：
          - type: hardBreak
          - type: text
            marks:
              - type: textStyle
                attrs:
                  fontSize: null
                  color: "#d97706"
              - type: bold
            text: https://developers.meta.com/horizon/downloads/package/unreal-engine-5-integration/
        en:
          - type: text
            text: Hand gestures fail when packaging Quest for Android in UE versions prior
              to 5.6.
          - type: hardBreak
          - type: hardBreak
          - type: text
            text: "Solution:"
          - type: hardBreak
          - type: hardBreak
          - type: text
            text: 1. MetaXR must be enabled for Quest. Locate MetaXR in Project Settings.
          - type: hardBreak
          - type: hardBreak
          - type: text
            text: 2. Select "Epic Native OpenXR with Oculus vendor extensions" for the XR
              API.
          - type: hardBreak
          - type: hardBreak
          - type: text
            text: 3. Set Hand Tracking Support to "Controllers and Hands."
          - type: hardBreak
          - type: hardBreak
          - type: text
            text: "MetaXR Download Link:"
          - type: hardBreak
          - type: text
            text: https://developers.meta.com/horizon/downloads/package/unreal-engine-5-integration/
      documentOrder:
        zh: 23
        en: 24
