version: 1
blockOrder:
  - p-component-ui-display-category-0
  - p-component-ui-display-parameters-0
blocks:
  p-component-ui-display-category-0:
    type: text
    isFloating: false
    style:
      size: text-base
      isSectionHeader: true
      paragraphTypes:
        zh:
          type: heading
          level: 2
        en:
          type: paragraph
      headingLevel: 2
      richText:
        zh:
          - type: text
            text: 组件设置
        en: []
